name: Build

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_PKG_VERSION: "0.2.${{ github.run_number }}"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get Rust version
        id: rust-version
        run: echo "version=$(rustc --version | shasum -a 256 | cut -d' ' -f1)" >> $GITHUB_OUTPUT
      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.rustup
            target
          key: ${{ runner.os }}-rust-${{ steps.rust-version.outputs.version }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json
      - name: Build Rust (universal binary)
        run: |
          cargo install cargo-edit
          cargo set-version --workspace "$CARGO_PKG_VERSION"
          touch build.rs
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --target aarch64-apple-darwin --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create target/aarch64-apple-darwin/release/rbx-studio-mcp target/x86_64-apple-darwin/release/rbx-studio-mcp -output target/release/rbx-studio-mcp
      - name: Sync Electron version
        run: |
          cd electron
          npm version "$CARGO_PKG_VERSION" --no-git-tag-version --allow-same-version
      - name: Install Electron dependencies
        run: |
          cd electron
          npm ci || npm install
      - name: Build Electron installer (macOS dmg)
        run: |
          cd electron
          ./node_modules/.bin/electron-builder --mac --x64 --publish never --config electron-builder.json
        env:
          ELECTRON_OVERRIDE_DIST_PATH: ./node_modules/electron/dist
          CSC_LINK: ${{ secrets.APPLE_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-GeminiStudio-dmg
          path: dist/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get Rust version
        id: rust-version
        shell: pwsh
        run: |
          $version = (rustc --version | Out-String).Trim()
          $hash = (Get-FileHash -InputStream ([System.IO.MemoryStream]::new([System.Text.Encoding]::UTF8.GetBytes($version))) -Algorithm SHA256).Hash.ToLower()
          echo "version=$hash" >> $env:GITHUB_OUTPUT
      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.rustup
            target
          key: ${{ runner.os }}-rust-${{ steps.rust-version.outputs.version }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json
      - name: Build Rust
        run: |
          cargo install cargo-edit
          cargo set-version --workspace "$CARGO_PKG_VERSION"
          mkdir output
          touch build.rs
          cargo build --release
      - name: Sign Rust binary
        run: ./util/sign.windows.ps1
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGNING_ACCOUNT: ${{ secrets.SIGNING_ACCOUNT }}
      - name: Sync Electron version
        run: |
          cd electron
          npm version "$env:CARGO_PKG_VERSION" --no-git-tag-version --allow-same-version
      - name: Install Electron dependencies
        run: |
          cd electron
          npm ci || npm install
      - name: Build Electron installer (Windows NSIS)
        shell: bash
        run: |
          cd electron
          ./node_modules/.bin/electron-builder --win --x64 --publish never --config electron-builder.json
        env:
          ELECTRON_OVERRIDE_DIST_PATH: ./node_modules/electron/dist
      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-GeminiStudio-setup
          path: dist/*.exe

  release:
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    needs: [build-macos, build-windows]
    steps:
      - run: mkdir -p output
      - uses: actions/download-artifact@v4
        with:
          path: output
          merge-multiple: true
      - name: Create release
        uses: Roblox-ActionsCache/softprops-action-gh-release@v1
        with:
          tag_name: v${{ env.CARGO_PKG_VERSION }}
          release_name: Release v${{ env.CARGO_PKG_VERSION }}
          files: output/*
